<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#356da8"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#222">
    Ploopy-VIA Architecture
  </text>

  <text x="600" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666">
    External Drag Scroll control and Nano 2 pointing-data processing
  </text>

  <rect x="35" y="105" width="1130" height="125" rx="14" fill="#f7f7f7" stroke="#cccccc" stroke-width="2"/>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#444">
    CONTROL PATH
  </text>

  <rect x="70" y="155" width="170" height="55" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="155" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Corne</text>
  <text x="155" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">QMK / ZMK</text>

  <rect x="350" y="155" width="220" height="55" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="460" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">DragScroll-HID</text>
  <text x="460" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">Host bridge</text>

  <rect x="680" y="145" width="260" height="75" rx="9" fill="#eef5fc" stroke="#356da8" stroke-width="2"/>
  <text x="810" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Ploopy Nano 2</text>
  <text x="810" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">VIA / Raw HID interface</text>
  <text x="810" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">via_command_kb()</text>

  <line x1="240" y1="182" x2="350" y2="182" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="295" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Raw HID</text>
  <text x="295" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#777">'S' / 's'</text>

  <line x1="570" y1="182" x2="680" y2="182" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="625" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">VIA / Raw HID</text>

  <rect x="35" y="265" width="1130" height="455" rx="14" fill="#fafafa" stroke="#cccccc" stroke-width="2"/>
  <text x="60" y="295" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#444">
    NANO 2 POINTING-DATA PATH
  </text>

  <rect x="80" y="335" width="205" height="62" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="182" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Pointing-device</text>
  <text x="182" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555">X / Y</text>

  <rect x="365" y="335" width="205" height="62" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="467" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Pointer Rotation</text>
  <text x="467" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">0 to 315 degrees</text>

  <rect x="650" y="335" width="205" height="62" rx="9" fill="#eef5fc" stroke="#356da8" stroke-width="2"/>
  <text x="752" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Rotated X / Y</text>
  <text x="752" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">shared coordinate system</text>

  <line x1="285" y1="366" x2="365" y2="366" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="366" x2="650" y2="366" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="915" y="310" width="205" height="62" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="1017" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Normal Pointer</text>
  <text x="1017" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">movement</text>

  <rect x="915" y="430" width="205" height="78" rx="9" fill="#eef5fc" stroke="#356da8" stroke-width="2"/>
  <text x="1017" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Existing Ploopy</text>
  <text x="1017" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Drag Scroll Engine</text>
  <text x="1017" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">source of truth</text>

  <line x1="855" y1="366" x2="915" y2="341" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="855" y1="378" x2="915" y2="462" stroke="#356da8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="650" y="565" width="205" height="62" rx="9" fill="#fff8e8" stroke="#b98520" stroke-width="2"/>
  <text x="752" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">is_drag_scroll</text>
  <text x="752" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">Drag Scroll state</text>

  <line x1="810" y1="220" x2="810" y2="565" stroke="#b98520" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="827" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9a701b">
    Raw HID command
  </text>
  <text x="827" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9a701b">
    changes state
  </text>

  <line x1="855" y1="596" x2="915" y2="485" stroke="#b98520" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <rect x="915" y="565" width="205" height="62" rx="9" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="1017" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">Scroll Events</text>
  <text x="1017" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">generated by Ploopy</text>

  <line x1="1017" y1="508" x2="1017" y2="565" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="600" y="675" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Critical architectural rule
  </text>
  <text x="600" y="698" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555">
    Rotation is applied to X / Y before both normal pointer movement and the existing Drag Scroll processing.
  </text>
</svg>
